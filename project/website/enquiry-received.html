<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17372c">
  <title>Enquiry received | Boxpace Hospitality</title>
  <style>
    :root{color-scheme:light;--forest:#17372c;--cream:#f7f5ef;--muted:#65736a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--cream);color:#1b2922;font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(620px,100%);padding:clamp(28px,7vw,64px);background:#fffefa;border:1px solid #dedfd5;border-radius:12px;text-align:center}
    .mark{width:48px;height:48px;margin:0 auto 24px;border-radius:14px;background:var(--forest);color:#e6eee4;display:grid;place-items:center;font:26px Georgia,serif}
    h1{margin:0;color:var(--forest);font:500 clamp(36px,7vw,56px)/1.05 Georgia,serif;letter-spacing:-.03em}
    p{margin:18px auto 0;max-width:430px;color:var(--muted)}
    nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
    a{padding:11px 16px;border:1px solid var(--forest);border-radius:4px;color:var(--forest);text-decoration:none;font-size:14px}
    a:first-child{background:var(--forest);color:white}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">B</div>
    <h1>Thank you. We received your enquiry.</h1>
    <p>Boxpace Hospitality will follow up using the contact details you provided.</p>
    <p><a href="mailto:rcworks.luxe@gmail.com">rcworks.luxe@gmail.com</a> · <a href="tel:+919833837560">Call +91 9833837560</a></p>
    <nav aria-label="Next steps">
      <a href="/">Return to Boxpace</a>
    </nav>
  </main>
</body>
</html>
